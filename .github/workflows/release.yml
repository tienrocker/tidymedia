name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build + draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bật 2 secret dưới khi wire tauri-plugin-updater (kế hoạch: trước 1.0)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TidyMedia ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $dir = "portable-staging"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/release/tidymedia.exe" $dir
          # ffmpeg/ffprobe sidecar (fetch-ffmpeg.ps1 đã chạy trong beforeBuildCommand)
          Copy-Item -Recurse "src-tauri/binaries" "$dir/binaries"
          # portable.marker: app dùng .\data cạnh exe thay vì %APPDATA%
          New-Item -ItemType File "$dir/portable.marker" | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "TidyMedia_${version}_portable.zip"
          gh release upload "${{ github.ref_name }}" "TidyMedia_${version}_portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
