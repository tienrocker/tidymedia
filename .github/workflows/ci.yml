name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build validate bundle.resources lúc compile — CI check/test không
      # bundle nên placeholder rỗng là đủ, khỏi tải 90MB ffmpeg mỗi run.
      # Release thật đi qua release.yml -> beforeBuildCommand fetch bản thật
      # (pin version + SHA256).
      - name: Stub ffmpeg resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          foreach ($f in "ffmpeg.exe", "ffprobe.exe", "ffmpeg-LICENSE.txt") {
            New-Item -ItemType File -Force "src-tauri/binaries/$f" | Out-Null
          }

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace
